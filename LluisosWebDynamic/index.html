<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web en desenvolupament</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 480px;
      width: 100%;
    }

    .logo {
      width: 160px;
      max-width: 80vw;
      height: auto;
      margin-bottom: 32px;
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    p {
      font-size: 18px;
      color: #555555;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="static/images/logoantic.png" alt="Logo" class="logo">
    <h1>Web en desenvolupament</h1>
    <p>Pròximament...</p>
  </main>
</body>
</html>
